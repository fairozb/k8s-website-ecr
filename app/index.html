<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps CI/CD Demo · v7</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #e6edf3;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .glow {
      position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.45; z-index: 0;
    }
    .glow.a { width: 380px; height: 380px; background: #38bdf8; top: -120px; left: -100px; }
    .glow.b { width: 420px; height: 420px; background: #a855f7; bottom: -140px; right: -120px; }
    .card {
      position: relative; z-index: 1;
      width: min(92vw, 640px);
      padding: 48px 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      text-align: center;
      animation: rise 0.7s ease-out;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px);} to {opacity:1; transform: none;} }
    .badge {
      display: inline-block;
      font-size: 15px; font-weight: 700; letter-spacing: 1px;
      color: #04121a;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
      padding: 8px 20px; border-radius: 999px; margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(56,189,248,0.45);
    }
    h1 { font-size: 34px; line-height: 1.2; margin-bottom: 14px; }
    h1 span { background: linear-gradient(90deg,#38bdf8,#a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.lead { font-size: 16px; color: #b9c6d3; margin-bottom: 28px; }
    .pipe {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px;
    }
    .pipe span {
      font-size: 12.5px; font-weight: 600;
      background: rgba(56,189,248,0.14);
      border: 1px solid rgba(56,189,248,0.35);
      color: #cdefff; padding: 6px 12px; border-radius: 8px;
    }
    .stack { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .chip {
      font-size: 12px; color: #dfe7ef; padding: 6px 14px;
      border-radius: 999px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    footer { margin-top: 30px; font-size: 12px; color: #8aa0b3; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 10px #22c55e; margin-right:6px; }
  </style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <main class="card">
    <div class="badge">VERSION 3</div>
    <h1>Deployed with <span>CI/CD</span> on AWS</h1>
    <p class="lead">A container image built in Jenkins, pushed to Amazon ECR,
       and running on Kubernetes (k3s) — all provisioned with Terraform.</p>

    <div class="pipe">
      <span>Commit</span><span>Jenkins</span><span>Docker</span>
      <span>ECR</span><span>Kubernetes</span><span>Live</span>
    </div>

    <div class="stack">
      <span class="chip">Terraform</span>
      <span class="chip">Jenkins</span>
      <span class="chip">Docker</span>
      <span class="chip">Amazon ECR</span>
      <span class="chip">k3s</span>
      <span class="chip">AWS EC2</span>
    </div>

    <footer><span class="dot"></span>Live on Kubernetes · NodePort 30001</footer>
  </main>
</body>
</html>
